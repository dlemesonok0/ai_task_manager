version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_task_manager_api
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - ./logs:/app/logs
      - ./backend/credentials.json:/app/credentials.json:ro
      - ./backend/token.json:/app/token.json
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_task_manager_bot
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - ./logs:/app/logs
      - ./backend/credentials.json:/app/credentials.json:ro
      - ./backend/token.json:/app/token.json
    command: python bot.py

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_task_manager_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

  logs-ui:
    image: amir20/dozzle:latest
    container_name: ai_task_manager_logs_ui
    restart: always
    ports:
      - "${DOZZLE_BIND_ADDRESS:-127.0.0.1}:${DOZZLE_PORT:-9999}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOZZLE_FILTER: "name=ai_task_manager_*"

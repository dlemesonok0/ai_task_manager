name: Security / SAST DAST SCA

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  sast-semgrep:
    name: SAST / Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Run Semgrep JSON report
        run: semgrep scan --config p/security-audit --config p/python --config p/javascript --config .semgrep.yml backend frontend --json --output semgrep-report.json || true

      - name: Run Semgrep text report
        run: semgrep scan --config p/security-audit --config p/python --config p/javascript --config .semgrep.yml backend frontend --text --output semgrep-report.txt || true

      - name: Run Semgrep SARIF report
        run: semgrep scan --config p/security-audit --config p/python --config p/javascript --config .semgrep.yml backend frontend --sarif --output semgrep.sarif || true

      - name: Enforce Semgrep gate
        run: semgrep scan --config p/security-audit --config p/python --config p/javascript --config .semgrep.yml backend frontend

      - name: Upload Semgrep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-semgrep-reports
          path: |
            semgrep-report.json
            semgrep-report.txt
            semgrep.sarif
          if-no-files-found: warn

      - name: Add SAST summary
        if: always()
        run: |
          {
            echo "## SAST / Semgrep"
            echo "Configs: \`p/security-audit\`, \`p/python\`, \`p/javascript\`, \`.semgrep.yml\`"
            echo "Report artifact: \`sast-semgrep-reports\`"
            echo '```'
            cat semgrep-report.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  sca-trivy:
    name: SCA / Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy table report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml
          format: table
          output: trivy-report.txt
          exit-code: "0"

      - name: Run Trivy JSON gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml
          format: json
          output: trivy-report.json
          exit-code: "1"

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-trivy-reports
          path: |
            trivy-report.txt
            trivy-report.json
          if-no-files-found: warn

      - name: Add SCA summary
        if: always()
        run: |
          {
            echo "## SCA / Trivy"
            echo "Config: \`trivy.yaml\`"
            echo "Report artifact: \`sca-trivy-reports\`"
            echo '```'
            tail -n 80 trivy-report.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  dast-zap:
    name: DAST / OWASP ZAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write CI backend environment
        run: |
          cat > backend/.env <<ENVEOF
          TELEGRAM_BOT_TOKEN=
          GEMINI_API_KEY=
          AUTH_SECRET_KEY=${AUTH_SECRET_KEY}
          AUTH_TOKEN_TTL_SECONDS=86400
          CORS_ALLOW_ORIGINS=http://localhost,http://frontend
          LOG_DIR=logs
          LOG_FILE_NAME=app.log
          LOG_LEVEL=INFO
          LOG_MAX_BYTES=5242880
          LOG_BACKUP_COUNT=5
          ENVEOF
        env:
          AUTH_SECRET_KEY: ${{ secrets.AUTH_SECRET_KEY || 'ci-auth-secret-key-with-at-least-32chars' }}

      - name: Build and start application
        run: |
          docker compose up -d --build db api frontend
          sleep 20
          docker compose ps
        env:
          COMPOSE_PROJECT_NAME: ai_task_manager

      - name: Run ZAP baseline
        id: zap
        continue-on-error: true
        run: |
          mkdir -p reports/security
          cp zap-baseline.conf reports/security/zap-baseline.conf
          chmod -R 777 reports/security
          docker run --rm --network ai_task_manager_default -v "${PWD}/reports/security:/zap/wrk/:rw" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://frontend -c zap-baseline.conf -r zap-report.html -J zap-report.json
        env:
          COMPOSE_PROJECT_NAME: ai_task_manager

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-zap-reports
          path: |
            reports/security/zap-report.html
            reports/security/zap-report.json
          if-no-files-found: warn

      - name: Add DAST summary
        if: always()
        run: |
          {
            echo "## DAST / OWASP ZAP"
            echo "Config: \`zap-baseline.conf\`"
            echo "Report artifact: \`dast-zap-reports\`"
            if [ -f reports/security/zap-report.json ]; then
              echo
              echo "### Alert counts"
              jq -r '
                [.. | objects | select(has("riskdesc") and has("alert"))] as $alerts
                | if ($alerts | length) == 0 then
                    "- No alerts found"
                  else
                    ($alerts | group_by(.riskdesc)[] | "- " + .[0].riskdesc + ": " + (length | tostring))
                  end
              ' reports/security/zap-report.json
              echo
              echo "### Alerts"
              jq -r '
                [.. | objects | select(has("riskdesc") and has("alert"))] as $alerts
                | if ($alerts | length) == 0 then
                    "- No alerts found"
                  else
                    ($alerts[] | "- [" + .riskdesc + "] " + .alert)
                  end
              ' reports/security/zap-report.json | sort -u | head -n 30
            else
              echo
              echo "ZAP JSON report was not generated. Check the DAST job logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop application
        if: always()
        run: docker compose down -v
        env:
          COMPOSE_PROJECT_NAME: ai_task_manager

      - name: Enforce ZAP gate
        if: always() && steps.zap.outcome == 'failure'
        run: exit 1

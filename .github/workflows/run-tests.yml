name: CI / Run Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/ai_task_manager-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/ai_task_manager-frontend

jobs:
  reject-direct-push:
    name: Reject Direct Push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Require merge commit on protected branch
        run: |
          parent_count="$(git rev-list --parents -n 1 HEAD | wc -w)"
          if [ "$parent_count" -lt 3 ]; then
            echo "Direct pushes to master are not allowed. Merge a pull request instead."
            exit 1
          fi

  backend-tests:
    name: Backend Tests
    needs:
      - reject-direct-push
    if: always() && (needs.reject-direct-push.result == 'success' || needs.reject-direct-push.result == 'skipped')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Run tests with coverage
        run: |
          uv run pytest --cov=. --cov-report=term-missing --cov-report=html | tee coverage.txt
          {
            echo "## Backend coverage"
            echo '```'
            tail -n 40 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/htmlcov
          if-no-files-found: error

  frontend-tests:
    name: Frontend Tests
    needs:
      - reject-direct-push
    if: always() && (needs.reject-direct-push.result == 'success' || needs.reject-direct-push.result == 'skipped')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest with coverage
        run: |
          npx vitest run --coverage --coverage.reporter=text --coverage.reporter=html | tee coverage.txt
          {
            echo "## Frontend coverage"
            echo '```'
            tail -n 40 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: error

  deploy:
    name: Deploy
    needs:
      - reject-direct-push
      - backend-tests
      - frontend-tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master') && needs.reject-direct-push.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:master
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:master
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            mkdir -p ~/ai_task_manager
            cd ~/ai_task_manager
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            export BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            export FRONTEND_IMAGE=${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            docker compose pull api bot frontend
            docker compose up -d
